name: DreamKai360 Cloud Xenon Toolchain

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/xenon-cloud.yml'
      - 'cloud/**'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: dreamkai360-cloud-toolchain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose-and-build:
    name: Diagnose upstream Xenon SDK and build probe
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PREFIX: ${{ runner.temp }}/xenon-sdk
      DEVKITXENON: ${{ runner.temp }}/xenon-sdk
      PARALLEL: '-j2'
    steps:
      - name: Checkout DreamKai360
        uses: actions/checkout@v4

      - name: Confirm cloud runner and repository
        run: |
          set -eux
          uname -a
          git --version
          test -f cloud/xenon_probe.c
          test -f cloud/Makefile

      - name: Install Xenon toolchain build prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential gcc-multilib g++-multilib flex bison \
            libgmp-dev libmpfr-dev libmpc-dev texinfo git wget curl \
            tar patch xz-utils file binutils make autoconf automake \
            libtool gawk python3

      - name: Download upstream libXenon and locate build scripts
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Free60Project/libxenon.git third_party-libxenon
          git -C third_party-libxenon rev-parse HEAD | tee libxenon-commit.txt
          echo '--- repository top level ---'
          find third_party-libxenon -maxdepth 2 -type f | sort | head -250
          echo '--- candidate build scripts ---'
          find third_party-libxenon -type f \( -iname '*toolchain*' -o -iname '*build*xenon*' -o -name 'Makefile' \) | sort | head -300

      - name: Restore Xenon SDK cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/xenon-sdk
          key: ${{ runner.os }}-dreamkai360-xenon-sdk-v2
          restore-keys: |
            ${{ runner.os }}-dreamkai360-xenon-sdk-

      - name: Build Xenon toolchain and runtime
        run: |
          set -euxo pipefail
          mkdir -p "$DEVKITXENON"
          export PREFIX="$DEVKITXENON"
          export DEVKITXENON
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
          BUILDER="$(find third_party-libxenon -type f -name 'build-xenon-toolchain' -print -quit)"
          if [ -z "$BUILDER" ]; then
            echo "::error::Upstream checkout has no build-xenon-toolchain script."
            exit 2
          fi
          chmod +x "$BUILDER"
          BUILDER_DIR="$(dirname "$BUILDER")"
          cd "$BUILDER_DIR"
          ./build-xenon-toolchain toolchain
          ./build-xenon-toolchain libxenon
          test -x "$DEVKITXENON/bin/xenon-gcc"
          test -x "$DEVKITXENON/bin/xenon-ld"
          test -f "$DEVKITXENON/rules"
          test -f "$DEVKITXENON/app.lds"

      - name: Compile and inspect Xenon ELF probe
        run: |
          set -euxo pipefail
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
          make -C cloud clean all
          test -s cloud/dreamkai360_cloud_probe.elf32
          file cloud/dreamkai360_cloud_probe.elf32
          readelf -h cloud/dreamkai360_cloud_probe.elf32
          sha256sum cloud/dreamkai360_cloud_probe.elf32 | tee cloud/SHA256SUMS.txt

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p cloud-report
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Runner: $RUNNER_OS"
            echo "Upstream libXenon commit:"
            cat libxenon-commit.txt 2>/dev/null || echo "clone not completed"
            echo
            if [ -x "$DEVKITXENON/bin/xenon-gcc" ]; then
              "$DEVKITXENON/bin/xenon-gcc" --version || true
            else
              echo "xenon-gcc not produced"
            fi
          } > cloud-report/diagnostics.txt
          if [ -d third_party-libxenon ]; then
            find third_party-libxenon -maxdepth 3 -type f \( -iname '*toolchain*' -o -iname '*build*xenon*' \) | sort > cloud-report/build-script-candidates.txt || true
          fi

      - name: Upload build logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DreamKai360-cloud-toolchain-${{ github.run_number }}
          path: |
            cloud/dreamkai360_cloud_probe.elf32
            cloud/SHA256SUMS.txt
            cloud-report/**
            libxenon-commit.txt
            third_party-libxenon/toolchain/build.log
          if-no-files-found: warn
