name: DreamKai360 Cloud Xenon Toolchain

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/xenon-cloud.yml'
      - 'cloud/**'
      - 'README.md'

permissions:
  contents: read

jobs:
  xenon-cloud-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout DreamKai360
        uses: actions/checkout@v4

      - name: Verify repository files
        run: |
          set -eux
          test -f cloud/xenon_probe.c
          test -f cloud/Makefile
          uname -a
          gcc --version
          make --version

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential gcc-multilib g++-multilib flex bison \
            libgmp-dev libmpfr-dev libmpc-dev texinfo git wget curl \
            tar patch xz-utils file binutils make autoconf automake \
            libtool gawk python3

      - name: Clone and inspect upstream libXenon
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Free60Project/libxenon.git third_party-libxenon
          git -C third_party-libxenon rev-parse HEAD | tee libxenon-commit.txt
          test -x third_party-libxenon/toolchain/build-xenon-toolchain
          echo 'Upstream toolchain builder found:'
          ls -l third_party-libxenon/toolchain/build-xenon-toolchain
          echo 'Toolchain builder options:'
          third_party-libxenon/toolchain/build-xenon-toolchain --help || true

      - name: Upload upstream diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DreamKai360-cloud-diagnostics-${{ github.run_number }}
          path: |
            libxenon-commit.txt
            third_party-libxenon/toolchain/build-xenon-toolchain
          if-no-files-found: warn
